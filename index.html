<!doctype html>
<html dir="rtl" lang="ku">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" media="(prefers-color-scheme: light)" href="/Peyvok-logo-01.png" />
  <link rel="icon" type="image/png" media="(prefers-color-scheme: dark)" href="/Peyvok-logo-02.png" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />

  <!-- Preload Google Fonts to prevent splash screen flicker -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">

  <script>
    window.__SPLASH_START_TIME__ = Date.now();
    (function () {
      try {
        var theme = localStorage.getItem('theme');
        if (theme === 'light' || (!theme && window.matchMedia('(prefers-color-scheme: light)').matches)) {
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        }
      } catch (e) { }
    })();
  </script>

  <!-- Mobile App Experience (iOS & Android) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-title" content="Peyvok" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap');

    html,
    body {
      background-color: #f8fafc !important;
      background: #f8fafc !important;
      margin: 0;
      padding: 0;
    }

    /* Mimic Tailwind CSS reset for the splash screen */
    #splash-screen * {
      box-sizing: border-box;
      line-height: 1.5;
    }

    /* SPLASH SCREEN UI ELEMENTS */
    .splash-text-main {
      font-size: 14px;
      line-height: 20px;
      font-weight: bold;
      font-family: 'Vazirmatn', sans-serif;
      color: #ca8a04;
    }
    .splash-text-sub {
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
      font-family: 'Vazirmatn', sans-serif;
      color: #737373;
      opacity: 0.5;
    }
    .splash-track {
      width: 100%;
      height: 24px;
      background-color: #e5e7eb;
      border-radius: 6px;
      padding: 2px;
      border: 1px solid #d1d5db;
    }

    /* Dark Mode Overrides */
    @media (prefers-color-scheme: dark) {
      .splash-text-main { color: rgba(234, 179, 8, 0.9); }
      .splash-text-sub { color: #a3a3a3; }
      .splash-track {
        background-color: rgba(17, 24, 39, 0.8);
        border: 1px solid #1f2937;
      }
    }
    html.dark .splash-text-main { color: rgba(234, 179, 8, 0.9); }
    html.dark .splash-text-sub { color: #a3a3a3; }
    html.dark .splash-track {
      background-color: rgba(17, 24, 39, 0.8);
      border: 1px solid #1f2937;
    }

    @media (prefers-color-scheme: dark) {

      html,
      body {
        background-color: #000000 !important;
        background: #000000 !important;
      }
    }

    html.dark,
    html.dark body {
      background-color: #000000 !important;
      background: #000000 !important;
    }

    html.light,
    html.light body {
      background-color: #f8fafc !important;
      background: #f8fafc !important;
    }

    /* INITIAL SPLASH SCREEN CSS - Runs instantly before React */
    #splash-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(to bottom, #0A0A0A, #000000);
      z-index: 99999;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    html.light #splash-screen {
      background: linear-gradient(to bottom, #FAFAFA, #E5E5E5);
    }

    .splash-orb-1 {
      position: absolute;
      top: 10%;
      left: 10%;
      width: 384px;
      height: 384px;
      background-color: rgba(234, 179, 8, 0.2);
      border-radius: 9999px;
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
    }

    html.light .splash-orb-1 {
      background-color: rgba(234, 179, 8, 0.1);
    }

    .splash-orb-2 {
      position: absolute;
      bottom: 10%;
      right: 10%;
      width: 384px;
      height: 384px;
      background-color: rgba(16, 185, 129, 0.1);
      border-radius: 9999px;
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
    }

    .splash-classic-icon {
      width: 256px;
      height: 96px;
      overflow: visible;
    }

    @keyframes wordle-jump-splash {
      0% {
        transform: translateY(0) rotate(calc(var(--base-rot) * 1deg));
      }

      20% {
        transform: translateY(-14px) rotate(calc(var(--base-rot) * 1deg - 8deg));
      }

      40% {
        transform: translateY(2px) rotate(calc(var(--base-rot) * 1deg + 3deg));
      }

      55%,
      100% {
        transform: translateY(0) rotate(calc(var(--base-rot) * 1deg));
      }
    }

    @keyframes star-burst-splash {

      0%,
      30% {
        transform: scale(0) rotate(0deg);
        opacity: 0;
      }

      35% {
        transform: scale(1.5) rotate(45deg);
        opacity: 1;
      }

      55% {
        transform: scale(0.5) rotate(120deg);
        opacity: 0;
      }

      100% {
        opacity: 0;
      }
    }

    .splash-text {
      margin-top: 0px;
      font-size: 16px;
      font-weight: bold;
      color: #ca8a04;
      text-transform: uppercase;
      letter-spacing: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      animation: splash-pulse-text 1.5s ease-in-out infinite;
    }

    @keyframes splash-pulse-text {

      0%,
      100% {
        opacity: 0.5;
      }

      50% {
        opacity: 1;
      }
    }
  </style>

  <meta name="description"
    content="Play Peyvok (پەیڤۆک), the most fun and challenging Kurdish word puzzle game. Train your brain and find the hidden words!" />
  <meta name="keywords" content="peyvok, peyvok game, پەیڤۆک, یارییا پەیڤۆک, kurdish word game, kurdish game" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.peyvokgame.com/" />
  <meta property="og:title" content="Peyvok - پەیڤۆک | The Ultimate Kurdish Word Game" />
  <meta property="og:description"
    content="Play Peyvok (پەیڤۆک), the most fun and challenging Kurdish word puzzle game. Train your brain and find the hidden words!" />
  <meta property="og:image" content="https://www.peyvokgame.com/Peyvok-logo-02.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://www.peyvokgame.com/" />
  <meta property="twitter:title" content="Peyvok - پەیڤۆک | The Ultimate Kurdish Word Game" />
  <meta property="twitter:description"

  <meta property="twitter:image" content="https://www.peyvokgame.com/Peyvok-logo-02.png" />

  </script>

<body
  class="bg-background text-on-surface font-body selection:bg-primary-container selection:text-on-primary-container overflow-hidden">

  <div id="root">
    <!-- NATIVE INSTANT SPLASH SCREEN (Replaced by React on load) -->
    <div id="splash-screen" style="gap: 32px;">
      <!-- Background Image -->
      <div style="position: absolute; inset: 0; background-image: url('/assets/kurdistan_bg.jpg'); background-size: cover; background-position: center; background-repeat: no-repeat; z-index: 0;"></div>

      <div style="position: absolute; inset: 0; background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); z-index: 1;"></div>
      
      <div class="splash-orb-1" style="z-index: 2;"></div>
      <div class="splash-orb-2" style="z-index: 2;"></div>
      <div

        <svg viewBox="0 0 180 50" class="splash-classic-icon" xmlns="http://www.w3.org/2000/svg">
          <g

            <rect x="152" y="16" width="26" height="28" rx="6" fill="#ca8a04" />

          </g>
          <g
            style="--base-rot: 2; animation: wordle-jump-splash 2s infinite 0.1s ease-in-out; transform-origin: 135px 30px;">

          <g
            style="--base-rot: -4; animation: wordle-jump-splash 2s infinite 0.2s ease-in-out; transform-origin: 105px 27px;">

            <rect x="92" y="13" width="26" height="26" rx="6" fill="#eab308" stroke="#ffffff" stroke-width="0.5"
              stroke-opacity="0.9" />
            <text x="105" y="27" fill="#ffffff" font-size="15" font-weight="900" font-family="sans-serif"
              text-anchor="middle" alignment-baseline="middle" style="text-shadow: 0px 2px 3px rgba(0,0,0,0.3)">پ</text>
          </g>
          <g
            style="--base-rot: 3; animation: wordle-jump-splash 2s infinite 0.3s ease-in-out; transform-origin: 75px 29px;">
            <rect x="62" y="17" width="26" height="28" rx="6" fill="#16a34a" />
            <rect x="62" y="15" width="26" height="26" rx="6" fill="#22c55e" stroke="#ffffff" stroke-width="0.5"

            <text x="75" y="29" fill="#ffffff" font-size="15" font-weight="900" font-family="sans-serif"

          </g>
          <g
            style="--base-rot: -2; animation: wordle-jump-splash 2s infinite 0.4s ease-in-out; transform-origin: 45px 31px;">
            <rect x="32" y="19" width="26" height="28" rx="6" fill="#16a34a" />
            <rect x="32" y="17" width="26" height="26" rx="6" fill="#22c55e" stroke="#ffffff" stroke-width="0.5"
              stroke-opacity="0.9" />
            <text x="45" y="31" fill="#ffffff" font-size="15" font-weight="900" font-family="sans-serif"
              text-anchor="middle" alignment-baseline="middle" style="text-shadow: 0px 2px 3px rgba(0,0,0,0.3)">ۆ</text>
          </g>
          <g
            style="--base-rot: 4; animation: wordle-jump-splash 2s infinite 0.5s ease-in-out; transform-origin: 15px 28px;">
            <rect x="2" y="16" width="26" height="28" rx="6" fill="#16a34a" />
            <rect x="2" y="14" width="26" height="26" rx="6" fill="#22c55e" stroke="#ffffff" stroke-width="0.5"
              stroke-opacity="0.9" />
            <text x="15" y="28" fill="#ffffff" font-size="15" font-weight="900" font-family="sans-serif"
              text-anchor="middle" alignment-baseline="middle" style="text-shadow: 0px 2px 3px rgba(0,0,0,0.3)">ک</text>
          </g>
          <g style="transform: translate(75px, 15px);">
            <path d="M 0 -6 L 1.5 -2 L 6 -2 L 2.5 1 L 4 5.5 L 0 3 L -4 5.5 L -2.5 1 L -6 -2 L -1.5 -2 Z" fill="#fde047"
              style="animation: star-burst-splash 2s infinite 0.3s ease-out; transform-origin: 0 0;" />
          </g>
          <g style="transform: translate(45px, 17px);">
            <path d="M 0 -6 L 1.5 -2 L 6 -2 L 2.5 1 L 4 5.5 L 0 3 L -4 5.5 L -2.5 1 L -6 -2 L -1.5 -2 Z" fill="#fde047"
              style="animation: star-burst-splash 2s infinite 0.4s ease-out; transform-origin: 0 0;" />
          </g>
          <g style="transform: translate(15px, 14px);">
            <path d="M 0 -6 L 1.5 -2 L 6 -2 L 2.5 1 L 4 5.5 L 0 3 L -4 5.5 L -2.5 1 L -6 -2 L -1.5 -2 Z" fill="#fde047"
              style="animation: star-burst-splash 2s infinite 0.5s ease-out; transform-origin: 0 0;" />
          </g>
        </svg>
      </div>

      <div
        style="display: flex; flex-direction: column; align-items: center; width: 320px; gap: 8px; position: relative; z-index: 10;">
        <div
          style="display: flex; width: 100%; align-items: center; justify-content: center; padding-left: 8px; padding-right: 8px; margin-bottom: 4px;">
          <span dir="rtl" class="splash-text-main">چاڤەڕێبە...</span>
        </div>
        <div class="splash-track" style="position: relative;">
          <div style="position: absolute; top: 0; bottom: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 10;">
            <span
              style="font-size: 12px; font-weight: 900; color: white; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; font-variant-numeric: tabular-nums; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.8));"
              dir="ltr">٠٪</span>

        </div>
        <div style="height: 24px; margin-top: 12px; display: flex; align-items: center; justify-content: center;">
          <span class="splash-text-sub">گرێدان ب سێرڤەران...</span>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.jsx"></script>
</body>
