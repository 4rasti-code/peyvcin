<!doctype html>
<html dir="rtl" lang="ku">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" media="(prefers-color-scheme: light)" href="/Peyvok-logo-01.png" />
  <link rel="icon" type="image/png" media="(prefers-color-scheme: dark)" href="/Peyvok-logo-02.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <script>
    (function() {
      try {
        var theme = localStorage.getItem('theme');
        if (theme === 'light' || (!theme && window.matchMedia('(prefers-color-scheme: light)').matches)) {
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Mobile App Experience (iOS & Android) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-title" content="Peyvok" />

  <style>
    html,
    body {
      background-color: #f8fafc !important;
      background: #f8fafc !important;
      margin: 0;
      padding: 0;
    }

    @media (prefers-color-scheme: dark) {

      html,
      body {
        background-color: #000000 !important;
        background: #000000 !important;
      }
    }

    html.dark,
    html.dark body {
      background-color: #000000 !important;
      background: #000000 !important;
    }
    
    html.light,
    html.light body {
      background-color: #f8fafc !important;
      background: #f8fafc !important;
    }

    /* INITIAL SPLASH SCREEN CSS - Runs instantly before React */
    #splash-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #000000;
      z-index: 99999;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html.light #splash-screen {
      background-color: #f8fafc;
    }

    .splash-sun-container {
      position: relative;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: splash-spin 20s linear infinite;
    }

    @keyframes splash-spin {
      100% {
        transform: rotate(360deg);
      }
    }

    .splash-sun-core {
      position: absolute;
      width: 44px;
      height: 44px;
      background-color: #FFD700;
      border-radius: 50%;
      z-index: 2;
    }

    .splash-sun-ray {
      position: absolute;
      width: 8px;
      height: 18px;
      background-color: #FFD700;
      top: 0;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      transform-origin: 50% 40px;
      animation: splash-pulse-ray 2s ease-in-out infinite;
    }

    @keyframes splash-pulse-ray {

      0%,
      100% {
        opacity: 0.8;
      }

      50% {
        opacity: 1;
      }
    }

    .splash-text {
      margin-top: 40px;
      font-size: 14px;
      font-weight: 900;
      color: #eab308;
      letter-spacing: 1px;
      animation: splash-pulse-text 1.5s ease-in-out infinite;
    }

    @keyframes splash-pulse-text {

      0%,
      100% {
        opacity: 0.5;
      }

      50% {
        opacity: 1;
      }
    }
  </style>

  <meta name="description"
    content="Play Peyvok (پەیڤۆک), the most fun and challenging Kurdish word puzzle game. Train your brain and find the hidden words!" />
  <meta name="keywords"
    content="peyvok, peyvok game, پەیڤۆک, یارییا پەیڤۆک, kurdish word game, kurdish game" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.peyvokgame.com/" />
  <meta property="og:title" content="Peyvok - پەیڤۆک | The Ultimate Kurdish Word Game" />
  <meta property="og:description"
    content="Play Peyvok (پەیڤۆک), the most fun and challenging Kurdish word puzzle game. Train your brain and find the hidden words!" />
  <meta property="og:image" content="https://www.peyvokgame.com/Peyvok-logo-02.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://www.peyvokgame.com/" />
  <meta property="twitter:title" content="Peyvok - پەیڤۆک | The Ultimate Kurdish Word Game" />
  <meta property="twitter:description"
    content="Play Peyvok (پەیڤۆک), the most fun and challenging Kurdish word puzzle game. Train your brain and find the hidden words!" />
  <meta property="twitter:image" content="https://www.peyvokgame.com/Peyvok-logo-02.png" />

  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" media="(prefers-color-scheme: light)" href="/Peyvok-logo-01.png" />
  <link rel="apple-touch-icon" media="(prefers-color-scheme: dark)" href="/Peyvok-logo-02.png" />
  <title>Peyvok - پەیڤۆک | The Ultimate Kurdish Word Game</title>
  <script>
    // iOS PWA Height Fix
    const setAppHeight = () => {
      document.documentElement.style.setProperty('--app-height', `${window.innerHeight}px`);
    };
    window.addEventListener('resize', setAppHeight);
    window.addEventListener('orientationchange', setAppHeight);
    setAppHeight();
  </script>
</head>

<body style="background-color: #000000 !important; overscroll-behavior-y: none; margin: 0; padding: 0;" class="bg-background text-on-surface font-body selection:bg-primary-container selection:text-on-primary-container overflow-hidden">

  <div id="root">
    <!-- NATIVE INSTANT SPLASH SCREEN (Replaced by React on load) -->
    <div id="splash-screen">
      <div class="splash-sun-container" id="splash-sun">
        <div class="splash-sun-core"></div>
        <script>
          const sun = document.getElementById('splash-sun');
          for (let i = 0; i < 21; i++) {
            const ray = document.createElement('div');
            ray.className = 'splash-sun-ray';
            ray.style.transform = `rotate(${i * (360 / 21)}deg)`;
            ray.style.animationDelay = `${i * 0.1}s`;
            sun.appendChild(ray);
          }
        </script>
      </div>
      <div class="splash-text" dir="rtl">چاڤەڕێبە...</div>
    </div>
  </div>

  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
